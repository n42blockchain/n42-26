# cargo-audit policy source for known transitive-dependency vulnerabilities.
# cargo-audit 0.22 does not load this file automatically, so CI passes these
# exact IDs through explicit `--ignore` flags in .github/workflows/nightly.yml.
#
# All entries below are vulnerabilities in dependencies that N42 does NOT
# control directly — they come through libp2p 0.56 and optional entries in the
# reth/revm dependency graph. Resolving them requires those upstreams to publish
# new releases. cargo-audit still surfaces NEW advisories not in this list,
# so the workflow continues to catch regressions.
#
# Owner: revisit this list whenever reth or libp2p is bumped. Drop entries
# whose source dependency has since released a fixed version.
#
# RUSTSEC-2026-0002 (lru 0.12.5) is intentionally not ignored here: cargo-audit
# reports it as an informational unsound warning, not a vulnerability. It is
# absent from the default feature graph and appears only through the optional
# n42-zkproof -> sp1-sdk 4.2.1 -> sp1-cuda/prover graph. Active direct N42 and
# Reth paths use patched lru 0.18.2 and 0.16.4 respectively. SP1 remains pinned
# to its deployed circuit/serialization boundary until a versioned migration.

[advisories]
# Empty on purpose. The three entries that used to live here — RUSTSEC-2026-0118
# and -0119 (hickory-proto 0.25.2, reached through libp2p 0.56) and
# RUSTSEC-2025-0055 (tracing-subscriber 0.2.25 under revm-precompile/arkworks) —
# no longer have a cause: moving to libp2p 0.57 left hickory-proto 0.26.1 as the
# only version in the tree, and tracing-subscriber is down to 0.3.23. An ignore
# that outlives its advisory is worse than none, because it silently absorbs the
# regression it was written to tolerate. Re-audit this list on every reth or
# libp2p bump.
ignore = []
