[package]
name = "n42-store-release-bench"
version = "0.1.0"
edition = "2024"
[workspace]
[lib]
path = "lib.rs"
[dependencies]
n42-twig-core = { path = "../../../crates/n42-twig-core" }
alloy-primitives = "=1.6.1"
reth-primitives-traits = "=0.6.0"
imbl = "=7.0.1"
rayon = "1.10"
thiserror = "=2.0.19"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
blake3 = "1.8"
metrics = "0.24"
tracing = "0.1"
tempfile = "3"
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
[profile.release]
lto = "thin"
