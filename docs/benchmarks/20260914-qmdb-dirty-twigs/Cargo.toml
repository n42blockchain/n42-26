[package]
name = "n42-dirty-twigs-bench"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
n42-twig-core-before = { path = "before" }
n42-twig-core-batch = { path = "batch" }
n42-twig-core-after = { path = "after" }
blake3 = "1"
bincode = "1.3"
[profile.release]
lto = "thin"
[[bin]]
name = "dirty-twigs"
path = "main.rs"

[[bin]]
name = "dirty-twigs-allocations"
path = "counted.rs"
