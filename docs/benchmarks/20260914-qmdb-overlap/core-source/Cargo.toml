# Frozen library-only dependency for this standalone experiment.
[package]
name = "n42-twig-core"
version = "0.5.1"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
[dependencies]
blake3 = "1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
rayon = { version = "1.10", optional = true }
[features]
default = []
rayon = ["dep:rayon"]
